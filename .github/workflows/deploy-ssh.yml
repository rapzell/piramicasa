name: Deploy a piramicasa.com (SFTP)

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar contenido publicado (anti-XSS)
        run: |
          node -e '
            const fs = require("fs");
            const files = ["content/overrides.json", "content/articles.json"];
            const bad = /<script|javascript:|onerror=|onload=|onclick=|onfocus=|<iframe|<object|<embed|data:text\/html/i;
            let fail = false;
            for (const f of files) {
              if (!fs.existsSync(f)) continue;
              const txt = fs.readFileSync(f, "utf8");
              const m = txt.match(bad);
              if (m) { console.error("Contenido sospechoso en " + f + ": " + m[0]); fail = true; }
            }
            if (fail) process.exit(1);
            console.log("Contenido limpio");
          '

      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy por SFTP a /html/ (canal cifrado)
        run: |
          lftp -u "$SSH_USERNAME","$SSH_PASSWORD" sftp://piramicasa.com -e "set sftp:auto-confirm yes; mirror --reverse --delete --verbose --no-perms --exclude-glob '.git/**' --exclude-glob '.github/**' --exclude-glob '.git*' --exclude-glob '_cms-setup/**' --exclude-glob '_*.py' --exclude-glob '_*.js' --exclude-glob '_*.txt' --exclude-glob '*.tar.gz' ./ /html/; quit"
        env:
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
