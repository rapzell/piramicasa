name: Deploy a piramicasa.com (FTP)

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy por FTP al hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: piramicasa.com
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          server-dir: /html/
          exclude: |
            **/.git*
            .github/**
            _cms-setup/**
            _*.py
            _*.js
            _*.txt
            *.tar.gz
