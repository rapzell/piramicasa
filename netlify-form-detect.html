<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form detection</title><link rel="stylesheet" href="/piramicasa/assets/sacred-grid.css?v=20260819d"/>
</head>
<body>
<form name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/piramicasa/gracias">
  <input type="hidden" name="form-name" value="contacto" />
  <input type="text" name="nombre" />
  <input type="tel" name="telefono" />
  <input type="email" name="email" />
  <select name="producto"><option>Piramicama</option></select>
  <textarea name="mensaje"></textarea>
</form>
<script src="/piramicasa/assets/sacred-grid.js?v=20260819d" defer></script>
<script id="pm-hash-scroll">(function(){function s(){var h=decodeURIComponent(location.hash||"");if(!h||h.length<2)return;var id=h.slice(1),n=0,m=120;var t=setInterval(function(){var el=document.getElementById(id);if(el){clearInterval(t);setTimeout(function(){try{el.scrollIntoView({behavior:"smooth",block:"start"})}catch(e){el.scrollIntoView(true)}},80)}else if(++n>=m){clearInterval(t)}},50)}window.addEventListener("hashchange",s);window.addEventListener("load",function(){if(location.hash)setTimeout(s,160)});if(location.hash)setTimeout(s,360)})();</script></body>
</html>
