<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form detection</title><link rel="stylesheet" href="/assets/sacred-grid.css"/>
</head>
<body>
<form name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/gracias">
  <input type="hidden" name="form-name" value="contacto" />
  <input type="text" name="nombre" />
  <input type="tel" name="telefono" />
  <input type="email" name="email" />
  <select name="producto"><option>Piramicama</option></select>
  <textarea name="mensaje"></textarea>
</form>
<script src="/assets/sacred-grid.js" defer></script>
</body>
</html>
