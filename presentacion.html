<!-- Piramicasa Contact Form -->
<div id="pm-contact-form" style="max-width:560px;margin:48px auto;padding:32px;background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);border:1px solid #E0D9D0">
  <h2 style="font-family:'Playfair Display',serif;font-size:1.6rem;color:#3D4A30;margin-bottom:8px;text-align:center">Solicita Información</h2>
  <p style="text-align:center;color:#8A817A;font-size:.9rem;margin-bottom:24px">Te responderemos en menos de 24 horas. Sin compromiso.</p>
  <form name="contacto" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/piramicasa/gracias" style="display:flex;flex-direction:column;gap:14px">
    <input type="hidden" name="form-name" value="contacto" />
    <p style="display:none"><label>No llenar: <input name="bot-field" /></label></p>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <div style="flex:1;min-width:200px">
        <label style="display:block;font-size:.8rem;font-weight:600;color:#3D4A30;margin-bottom:4px">Nombre *</label>
        <input type="text" name="nombre" required style="width:100%;padding:10px 14px;border:1px solid #E0D9D0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none" onfocus="this.style.borderColor='#C69C6D'" onblur="this.style.borderColor='#E0D9D0'" />
      </div>
      <div style="flex:1;min-width:200px">
        <label style="display:block;font-size:.8rem;font-weight:600;color:#3D4A30;margin-bottom:4px">Teléfono</label>
        <input type="tel" name="telefono" style="width:100%;padding:10px 14px;border:1px solid #E0D9D0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none" onfocus="this.style.borderColor='#C69C6D'" onblur="this.style.borderColor='#E0D9D0'" />
      </div>
    </div>
    <div>
      <label style="display:block;font-size:.8rem;font-weight:600;color:#3D4A30;margin-bottom:4px">Email *</label>
      <input type="email" name="email" required style="width:100%;padding:10px 14px;border:1px solid #E0D9D0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none" onfocus="this.style.borderColor='#C69C6D'" onblur="this.style.borderColor='#E0D9D0'" />
    </div>
    <div>
      <label style="display:block;font-size:.8rem;font-weight:600;color:#3D4A30;margin-bottom:4px">¿Qué producto te interesa?</label>
      <select name="producto" style="width:100%;padding:10px 14px;border:1px solid #E0D9D0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none;background:#fff" onfocus="this.style.borderColor='#C69C6D'" onblur="this.style.borderColor='#E0D9D0'">
        <option value="">Selecciona una opción...</option>
        <option value="Piramicama">Piramicama (cama piramidal)</option>
        <option value="Hygia">Pirámide Hygia</option>
        <option value="Hercules">Pirámide Hércules</option>
        <option value="Pirajardin">Pirajardín</option>
        <option value="Faraday">Arcones Faraday</option>
        <option value="Vital">Piramicasa Vital (portátil)</option>
        <option value="Piramascotas">Piramascotas</option>
        <option value="Otro">Otro / No estoy seguro</option>
      </select>
    </div>
    <div>
      <label style="display:block;font-size:.8rem;font-weight:600;color:#3D4A30;margin-bottom:4px">Mensaje *</label>
      <textarea name="mensaje" required rows="4" style="width:100%;padding:10px 14px;border:1px solid #E0D9D0;border-radius:8px;font-size:14px;box-sizing:border-box;outline:none;resize:vertical" onfocus="this.style.borderColor='#C69C6D'" onblur="this.style.borderColor='#E0D9D0'" placeholder="Cuéntanos qué necesitas..."></textarea>
    </div>
    <button type="submit" style="padding:14px 32px;background:linear-gradient(135deg,#3D4A30,#5A6B4A);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:transform .2s,box-shadow .2s">Enviar Solicitud ➤</button>
  </form>
  <p style="text-align:center;font-size:.75rem;color:#8A817A;margin-top:16px">Al enviar este formulario aceptas nuestra política de privacidad. No compartimos tus datos.</p>
</div>
